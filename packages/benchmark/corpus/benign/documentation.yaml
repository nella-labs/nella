  - id: "benign-doc-031"
    content: "## Prompt Injection Prevention\n\nPrompt injection occurs when an attacker embeds instructions in user input to override the system prompt. Our detection layer scans for common patterns like 'ignore previous instructions' and 'forget your prompt'."
