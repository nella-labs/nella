    content: "## SQL Injection\n\nNever concatenate user input into SQL queries. Use parameterized queries instead:\n\n```sql\n-- Bad: SELECT * FROM users WHERE id = '${userId}'\n-- Good: SELECT * FROM users WHERE id = $1\n```"
