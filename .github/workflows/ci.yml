name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Run tests with coverage
        run: pnpm -r test:ci

      - name: Check coverage thresholds
        run: |
          npx c8 check-coverage --lines 70 --branches 70 --functions 70 \
            --temp-directory packages/core/coverage \
            || echo "::warning::Core coverage below 70% threshold"
          npx c8 check-coverage --lines 70 --branches 70 --functions 70 \
            --temp-directory packages/api/coverage \
            || echo "::warning::API coverage below 70% threshold"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/lcov.info
          retention-days: 30

      - name: Require changeset for PRs
        if: github.event_name == 'pull_request'
        run: |
          npx changeset status --since=origin/main || {
            echo "::warning::No changeset found. If this PR has user-facing changes, run 'pnpm changeset' and commit the generated file."
          }

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
