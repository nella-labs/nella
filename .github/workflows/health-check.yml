name: "Health Check \u2014 Infrastructure"

on:
  schedule:
    # Run once per day at 06:00 UTC (~closest cron can get to 18h intervals)
    - cron: "0 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: health-check
  cancel-in-progress: true

env:
  GCP_REGION: us-central1

jobs:
  # ---------------------------------------------------------------------------
  # GCP Cloud Run — nella-mcp liveness
  # ---------------------------------------------------------------------------
  check-gcp-services:
    name: GCP Cloud Run Services
    runs-on: ubuntu-latest
    outputs:
      mcp_health: ${{ steps.mcp.outcome }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get nella-mcp URL
        id: mcp-url
        run: |
          URL=$(gcloud run services describe nella-mcp \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)' 2>/dev/null || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check nella-mcp /health
        id: mcp
        continue-on-error: true
        run: |
          URL="${{ steps.mcp-url.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "::error::nella-mcp service URL not found"
            exit 1
          fi
          for i in 1 2 3; do
            if curl -sf --max-time 15 "$URL/health" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok', f'Unexpected status: {d.get(\"status\")}'
          print(f'nella-mcp: status={d[\"status\"]} version={d.get(\"version\",\"?\")} uptime={d.get(\"uptime\",\"?\")}s')
            "; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::nella-mcp /health failed after 3 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # AI / ML API keys — lightweight validation (no credit-consuming calls)
  # ---------------------------------------------------------------------------
  check-ai-apis:
    name: AI API Keys
    runs-on: ubuntu-latest
    outputs:
      azure_embeddings: ${{ steps.azure-embeddings.outcome }}
      azure_embeddings_skipped: ${{ steps.azure-embeddings.outputs.skipped }}
      azure_rerank: ${{ steps.azure-rerank.outcome }}
      azure_rerank_skipped: ${{ steps.azure-rerank.outputs.skipped }}
    steps:
      - name: Check Azure Embeddings API
        id: azure-embeddings
        continue-on-error: true
        env:
          AZURE_EMBEDDING_API_KEY: ${{ secrets.AZURE_EMBEDDING_API_KEY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_EMBEDDING_DEPLOYMENT }}
        run: |
          if [ -z "$AZURE_EMBEDDING_API_KEY" ] || [ -z "$AZURE_ENDPOINT" ]; then
            echo "::notice::Azure Embeddings not configured"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DEPLOYMENT="${AZURE_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}"
          URL="${AZURE_ENDPOINT%/}/openai/deployments/${DEPLOYMENT}/embeddings?api-version=2024-06-01"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -H "api-key: $AZURE_EMBEDDING_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"input":["health check"]}' \
            "$URL")
          echo "Azure Embeddings API response: HTTP $STATUS"
          [ "$STATUS" = "200" ] || { echo "::error::Azure Embeddings returned HTTP $STATUS"; exit 1; }

      - name: Check Azure Cohere Rerank API
        id: azure-rerank
        continue-on-error: true
        env:
          AZURE_RERANK_API_KEY: ${{ secrets.AZURE_RERANK_API_KEY }}
          AZURE_RERANK_ENDPOINT: ${{ secrets.AZURE_RERANK_ENDPOINT }}
        run: |
          if [ -z "$AZURE_RERANK_API_KEY" ] || [ -z "$AZURE_RERANK_ENDPOINT" ]; then
            echo "::notice::Azure Cohere rerank not configured (optional)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -H "Authorization: Bearer $AZURE_RERANK_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"Cohere-rerank-v4.0-pro","query":"test","documents":["hello"],"top_n":1}' \
            "$AZURE_RERANK_ENDPOINT")
          echo "Azure Cohere Rerank API response: HTTP $STATUS"
          [ "$STATUS" = "200" ] || { echo "::error::Azure Cohere Rerank returned HTTP $STATUS"; exit 1; }

  # ---------------------------------------------------------------------------
  # npm Registry — verify published packages are accessible
  # ---------------------------------------------------------------------------
  check-npm-packages:
    name: npm Packages
    runs-on: ubuntu-latest
    outputs:
      nella: ${{ steps.nella.outcome }}
    steps:
      - name: Check @getnella/mcp
        id: nella
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://registry.npmjs.org/@getnella/mcp")
          echo "@getnella/mcp: HTTP $STATUS"
          [ "$STATUS" = "200" ] || { echo "::error::@getnella/mcp not accessible (HTTP $STATUS)"; exit 1; }

  # ---------------------------------------------------------------------------
  # Report — Create / update a GitHub Issue with a checklist
  # ---------------------------------------------------------------------------
  report:
    name: Update Health Report
    runs-on: ubuntu-latest
    needs: [check-gcp-services, check-ai-apis, check-npm-packages]
    if: always()
    steps:
      - name: Generate report and update issue
        uses: actions/github-script@v8
        with:
          script: |
            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Collect results from all jobs
            const checks = {
              // GCP Cloud Run
              mcp_health:        "${{ needs.check-gcp-services.outputs.mcp_health }}",
              // AI APIs (Azure)
              azure_embeddings:  "${{ needs.check-ai-apis.outputs.azure_embeddings }}",
              azure_rerank:      "${{ needs.check-ai-apis.outputs.azure_rerank }}",
              // npm packages
              npm_nella:         "${{ needs.check-npm-packages.outputs.nella }}",
            };

            // Optional provider skip flags
            const embeddingsSkipped = "${{ needs.check-ai-apis.outputs.azure_embeddings_skipped }}";
            const rerankSkipped = "${{ needs.check-ai-apis.outputs.azure_rerank_skipped }}";

            const ok = (v) => v === "success";
            const icon = (v) => ok(v) ? "x" : " ";
            const status = (v) => ok(v) ? "operational" : "**DOWN / ERROR**";

            // Severity-aware helpers for optional checks
            const optIcon = (v, skipped) => skipped === "true" ? "-" : icon(v);
            const optStatus = (v, skipped) => {
              if (skipped === "true") return "_skipped (optional)_";
              return status(v);
            };

            // Only required failures should trigger issue reopening
            const requiredFailed = [
              checks.mcp_health,
              checks.npm_nella,
            ].some(v => !ok(v));
            const optionalFailed =
              (!ok(checks.azure_embeddings) && embeddingsSkipped !== "true") ||
              (!ok(checks.azure_rerank) && rerankSkipped !== "true");
            const anyFailed = requiredFailed || optionalFailed;

            const body = [
              `## 🏥 Infrastructure Health Report`,
              ``,
              `**Last checked:** ${now}`,
              `**Workflow run:** [#${context.runNumber}](${runUrl})`,
              `**Overall status:** ${anyFailed ? "🔴 Issues detected" : "🟢 All systems operational"}`,
              ``,
              `---`,
              ``,
              `### GCP Cloud Run`,
              `- [${icon(checks.mcp_health)}] **nella-mcp** (/health) — ${status(checks.mcp_health)}`,
              ``,
              `### AI / ML APIs (Azure)`,
              `- [${optIcon(checks.azure_embeddings, embeddingsSkipped)}] **Azure OpenAI** (Embeddings) — ${optStatus(checks.azure_embeddings, embeddingsSkipped)}`,
              `- [${optIcon(checks.azure_rerank, rerankSkipped)}] **Azure Cohere** (Reranking, optional) — ${optStatus(checks.azure_rerank, rerankSkipped)}`,
              ``,
              `### npm Packages`,
              `- [${icon(checks.npm_nella)}] **@getnella/mcp** — ${status(checks.npm_nella)}`,
              ``,
              `---`,
              ``,
              `> 🤖 This issue is automatically maintained by the [Health Check workflow](${runUrl}).`,
              `> Checks run daily. If any check fails, this issue reopens and triggers a GitHub notification.`,
            ].join("\n");

            // Find existing health-check issue
            const label = "health-check";
            const title = "🏥 Infrastructure Health Report";

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "0E8A16",
                description: "Automated health check monitoring",
              });
            }

            // Search for existing issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: "all",
              per_page: 1,
              sort: "created",
              direction: "desc",
            });

            if (issues.length > 0) {
              const issue = issues[0];
              // Update the existing issue body
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
                state: anyFailed ? "open" : "closed",
              });
              console.log(`Updated issue #${issue.number} — state: ${anyFailed ? "open" : "closed"}`);
            } else {
              // Create new issue
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              // Pin it
              console.log(`Created issue #${newIssue.number}`);
              if (anyFailed) {
                console.log("Issue created in open state due to failures");
              } else {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: newIssue.number,
                  state: "closed",
                });
              }
            }

      - name: Notify Pushover
        if: failure()
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          curl -sf -X POST https://api.pushover.net/1/messages.json \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=Nella Health Alert" \
            --form-string "message=Health check failed — services may be down. Check GitHub issue." \
            --form-string "priority=2" \
            --form-string "sound=spacealarm" \
            --form-string "retry=300" \
            --form-string "expire=3600" \
            --form-string "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "url_title=View Run" \
            --form-string "html=1" || true
