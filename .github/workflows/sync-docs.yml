name: Sync Documentation

# =============================================================================
# DOCUMENTATION SYNC WORKFLOW
# =============================================================================
#
# This workflow automatically syncs documentation from nella/docs to the
# nella-website repository when changes are pushed to the main branch.
#
# SETUP INSTRUCTIONS:
# -------------------
# 1. Create a Personal Access Token (PAT) with repo permissions:
#    - Go to https://github.com/settings/tokens
#    - Click "Generate new token (classic)"
#    - Name: "Docs Sync Token" (or similar)
#    - Expiration: Set as needed (90 days recommended)
#    - Scopes: Check "repo" (Full control of private repositories)
#    - Click "Generate token"
#    - COPY THE TOKEN (you won't see it again!)
#
# 2. Add the token as a repository secret:
#    - Go to https://github.com/nella-labs/nella/settings/secrets/actions
#    - Click "New repository secret"
#    - Name: DOCS_SYNC_TOKEN
#    - Value: Paste the PAT you copied
#    - Click "Add secret"
#
# 3. Ensure the nella-website repo allows PRs from this workflow:
#    - The PAT owner must have write access to nella-labs/nella-website
#
# HOW IT WORKS:
# -------------
# 1. Triggered when docs/** files change on main branch
# 2. Checks out both nella and nella-website repos
# 3. Runs the sync script to transform and copy docs
# 4. Creates a PR in nella-website if there are changes
#
# MANUAL TRIGGER:
# ---------------
# You can manually trigger this workflow from the Actions tab by clicking
# "Run workflow" on the right side.
#
# =============================================================================

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no PR created)'
        required: false
        default: false
        type: boolean

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN != '' }}

    steps:
      - name: Check for DOCS_SYNC_TOKEN
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::DOCS_SYNC_TOKEN secret not configured — skipping docs sync."
          echo "See workflow comments above for setup instructions."

      - name: Checkout nella repo
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          path: nella

      - name: Checkout nella-website repo
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: nella-labs/nella-website
          path: nella-website
          token: ${{ secrets.DOCS_SYNC_TOKEN }}

      - name: Setup Node.js
        if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        if: env.HAS_TOKEN == 'true'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: env.HAS_TOKEN == 'true'
        working-directory: nella
        run: pnpm install --frozen-lockfile

      - name: Run docs sync
        if: env.HAS_TOKEN == 'true'
        working-directory: nella
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            pnpm sync-docs --dry-run
          else
            pnpm sync-docs
          fi

      - name: Check for changes
        if: env.HAS_TOKEN == 'true'
        id: changes
        working-directory: nella-website
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected:"
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No changes to sync"
          fi

      - name: Create Pull Request
        if: env.HAS_TOKEN == 'true' && steps.changes.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          path: nella-website
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          commit-message: 'docs: sync from nella/docs'
          title: '📚 Sync documentation from nella/docs'
          body: |
            ## 🔄 Automated Documentation Sync

            This PR was automatically generated when documentation was updated in the `nella` repository.

            ### Source
            - **Repository:** nella-labs/nella
            - **Branch:** main
            - **Commit:** [${{ github.sha }}](https://github.com/nella-labs/nella/commit/${{ github.sha }})
            - **Workflow run:** [${{ github.run_id }}](https://github.com/nella-labs/nella/actions/runs/${{ github.run_id }})

            ### What Changed
            Documentation files in `nella/docs` were updated and synced to this repository.

            ### Review Checklist
            - [ ] Check that MDX syntax is valid
            - [ ] Verify links work correctly
            - [ ] Preview the docs site locally if needed

            ---
            _This PR was auto-generated by the [docs sync workflow](https://github.com/nella-labs/nella/blob/main/.github/workflows/sync-docs.yml)._
          branch: docs-sync/${{ github.run_number }}
          delete-branch: true
          labels: |
            documentation
            automated
