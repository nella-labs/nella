name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/nella/**"
      - "Dockerfile"
      - "cloudbuild.yaml"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: nella-mcp
  ARTIFACT_REPO: nella

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push --all-tags \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --timeout=3600
            --concurrency=80
            --session-affinity
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only
            --add-cloudsql-instances=${{ vars.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:nella-db
            --service-account=nella-deploy@nella-sync.iam.gserviceaccount.com
            --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            GCP_STORAGE_BUCKET=nella-sync-indexes
          secrets: |
            SUPABASE_URL=SUPABASE_URL:latest
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
            REDIS_URL=REDIS_URL:latest
            GCP_CLOUD_SQL_INSTANCE=GCP_CLOUD_SQL_INSTANCE:latest
            GCP_DB_USER=GCP_DB_USER:latest
            GCP_DB_PASSWORD=GCP_DB_PASSWORD:latest
            GCP_DB_NAME=GCP_DB_NAME:latest
            NELLA_AUTH_ENCRYPTION_KEY=NELLA_AUTH_ENCRYPTION_KEY:latest
            NELLA_JWT_SECRET=NELLA_JWT_SECRET:latest
            VOYAGE_API_KEY=VOYAGE_API_KEY:latest

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          curl -sf "$URL/health" | python3 -m json.tool

  post-deploy-health:
    name: Post-Deploy Health Check
    needs: deploy
    if: success()
    uses: ./.github/workflows/health-check.yml
    secrets: inherit
