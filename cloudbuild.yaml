# Cloud Build configuration for nella MCP server (full GCP stack)
# Builds Docker image and deploys to Cloud Run
#
# Required substitutions (set in trigger or via --substitutions):
#   _REGION: GCP region (default: us-central1)
#   _SERVICE_NAME: Cloud Run service name (default: nella-mcp)
#
# Required secrets in Secret Manager:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, REDIS_URL,
#   GCP_CLOUD_SQL_INSTANCE, GCP_DB_USER, GCP_DB_PASSWORD, GCP_DB_NAME,
#   AZURE_EMBEDDING_API_KEY, AZURE_ENDPOINT, AZURE_EMBEDDING_DEPLOYMENT,
#   AZURE_RERANK_API_KEY, AZURE_RERANK_ENDPOINT,
#   NELLA_AUTH_ENCRYPTION_KEY, NELLA_JWT_SECRET

steps:
  # Build the Docker image
  # --target production: Dockerfile has builder/production/benchmark stages;
  # without an explicit target Docker picks the last stage (benchmark).
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--target"
      - "production"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}:$COMMIT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}:latest"
      - "."

  # Push the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}:$COMMIT_SHA"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--port"
      - "3000"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--timeout"
      - "3600"
      - "--concurrency"
      - "80"
      - "--session-affinity"
      - "--network"
      - "default"
      - "--subnet"
      - "default"
      - "--vpc-egress"
      - "private-ranges-only"
      - "--add-cloudsql-instances"
      - "$PROJECT_ID:${_REGION}:nella-db"
      - "--set-env-vars"
      - "NODE_ENV=production,GCP_STORAGE_BUCKET=nella-sync-indexes"
      - "--update-secrets"
      - "SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,REDIS_URL=REDIS_URL:latest,GCP_CLOUD_SQL_INSTANCE=GCP_CLOUD_SQL_INSTANCE:latest,GCP_DB_USER=GCP_DB_USER:latest,GCP_DB_PASSWORD=GCP_DB_PASSWORD:latest,GCP_DB_NAME=GCP_DB_NAME:latest,NELLA_AUTH_ENCRYPTION_KEY=NELLA_AUTH_ENCRYPTION_KEY:latest,NELLA_JWT_SECRET=NELLA_JWT_SECRET:latest,VOYAGE_API_KEY=VOYAGE_API_KEY:latest"
      - "--service-account"
      - "nella-deploy@nella-sync.iam.gserviceaccount.com"
      - "--allow-unauthenticated"

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: nella-mcp

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}"
