# Cloud Build configuration for nella MCP server
# Builds Docker image and deploys to Cloud Run
#
# Required substitutions (set in trigger or via --substitutions):
#   _REGION: GCP region (default: us-central1)
#   _SERVICE_NAME: Cloud Run service name (default: nella-mcp)
#
# Required secrets in Secret Manager:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}:$COMMIT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}:latest"
      - "."

  # Push the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}:$COMMIT_SHA"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--port"
      - "3000"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--timeout"
      - "300"
      - "--concurrency"
      - "80"
      - "--set-env-vars"
      - "NODE_ENV=production"
      - "--update-secrets"
      - "SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest"
      - "--allow-unauthenticated"

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: nella-mcp

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/nella/${_SERVICE_NAME}"
